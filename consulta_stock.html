<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Stock — Aluminios Franco</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: #111827; color: #e5e7eb; }
        
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #4A8C1C 0%, #111827 100%); }
        .login-box { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; }
        .login-box h1 { color: #4A8C1C; margin-bottom: 1rem; text-align: center; }
        .login-box input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: #111827; border: 1px solid #374151; border-radius: 6px; color: #e5e7eb; }
        .login-box button { width: 100%; padding: 0.75rem; background: #4A8C1C; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .login-box button:hover { background: #5A9A2E; }
        
        .app-container { display: none; }
        header { background: linear-gradient(135deg, #1f2937 0%, #374151 100%); border-bottom: 2px solid #4A8C1C; padding: 1.5rem 0; }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; }
        .logo { width: 50px; height: 50px; background: #4A8C1C; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
        .title-section h1 { font-size: 24px; color: #4A8C1C; }
        .badge { background: #374151; color: #4A8C1C; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 13px; font-weight: 600; }
        
        .main { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
        .filters-panel { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-weight: 600; color: #9ca3af; margin-bottom: 0.5rem; font-size: 14px; }
        .filter-group input, .filter-group select { padding: 0.75rem; background: #111827; border: 1px solid #374151; border-radius: 6px; color: #e5e7eb; font-family: 'Outfit', sans-serif; }
        
        .filter-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
        .btn-filter { padding: 0.75rem 1.5rem; background: #4A8C1C; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-filter:hover { background: #5A9A2E; }
        .btn-clear { padding: 0.75rem 1.5rem; background: #374151; color: #e5e7eb; border: none; border-radius: 6px; cursor: pointer; }
        
        .table-container { background: #1f2937; border: 1px solid #374151; border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { background: #374151; border-bottom: 2px solid #4A8C1C; }
        th { padding: 0.75rem; text-align: left; font-weight: 600; color: #4A8C1C; white-space: nowrap; }
        td { padding: 0.75rem; border-bottom: 1px solid #374151; }
        tbody tr:hover { background: #374151; }
        
        .status-stock { background: #d4edda; color: #155724; padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: 600; }
        .status-7dias { background: #fff3cd; color: #856404; padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: 600; }
        .status-sinstock { background: #f8d7da; color: #721c24; padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: 600; }
        
        .qty-ok { color: #4ade80; font-weight: 600; }
        .qty-low { color: #facc15; font-weight: 600; }
        .qty-none { color: #ef4444; font-weight: 600; }
        
        .btn-copy { background: #6366f1; color: white; padding: 0.4rem 0.8rem; font-size: 11px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-copy:hover { background: #818cf8; }
        
        .pagination { display: flex; justify-content: center; gap: 0.25rem; margin-top: 1rem; padding: 1rem 0; }
        .pagination button { padding: 0.5rem 0.75rem; background: #374151; color: #e5e7eb; border: 1px solid #4b5563; border-radius: 4px; cursor: pointer; }
        .pagination button.active { background: #4A8C1C; color: white; }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🔒 Acceso Interno</h1>
            <input type="password" id="pwd" placeholder="Contraseña">
            <button onclick="login()">Entrar</button>
        </div>
    </div>

    <div class="app-container" id="app">
        <header>
            <div class="header-content">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div class="logo">AF</div>
                    <div class="title-section">
                        <h1>ALUMINIOS FRANCO · STOCK</h1>
                    </div>
                </div>
                <div class="badge" id="badge">532 perfiles</div>
            </div>
        </header>

        <div class="main">
            <div class="filters-panel">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label>Buscar</label>
                        <input type="text" id="search" placeholder="Ref o Descripción">
                    </div>
                    <div class="filter-group">
                        <label>Tipo</label>
                        <select id="tipo"></select>
                    </div>
                    <div class="filter-group">
                        <label>Ancho (mm)</label>
                        <select id="ancho"></select>
                    </div>
                    <div class="filter-group">
                        <label>Alto (mm)</label>
                        <select id="alto"></select>
                    </div>
                    <div class="filter-group">
                        <label>Espesor (mm)</label>
                        <select id="espesor"></select>
                    </div>
                    <div class="filter-group">
                        <label>Longitud (mm)</label>
                        <select id="longitud"></select>
                    </div>
                    <div class="filter-group">
                        <label>Precio €/kg</label>
                        <input type="number" id="precio" value="6.00" step="0.01">
                    </div>
                </div>
                <div class="filter-buttons">
                    <button class="btn-filter" onclick="filter()">🔍 Filtrar</button>
                    <button class="btn-clear" onclick="reset()">↻ Limpiar</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Referencia</th>
                            <th>Descripción</th>
                            <th>Tipo</th>
                            <th>A</th>
                            <th>Al</th>
                            <th>E</th>
                            <th>Long.</th>
                            <th>Kg/m</th>
                            <th>€/m</th>
                            <th>Tar</th>
                            <th>Mur</th>
                            <th>Val</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Copiar</th>
                        </tr>
                    </thead>
                    <tbody id="table"></tbody>
                </table>
                <div class="pagination" id="pag"></div>
            </div>
        </div>
    </div>

    <script>
        const DATA = {json_str};
        let filtered = [];
        let page = 1;
        const perPage = 40;

        function login() {{
            if (document.getElementById('pwd').value === 'Murcia') {{
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                init();
            }} else {{
                alert('Contraseña incorrecta');
            }}
        }}

        function init() {{
            const tipos = [...new Set(DATA.map(x => x.tipo))].sort();
            const anchos = [...new Set(DATA.map(x => x.ancho).filter(x => x))].sort((a,b) => a-b);
            const altos = [...new Set(DATA.map(x => x.alto).filter(x => x))].sort((a,b) => a-b);
            const espesores = [...new Set(DATA.map(x => x.espesor).filter(x => x))].sort((a,b) => a-b);
            const longitudes = [...new Set(DATA.map(x => x.longitud))].sort((a,b) => a-b);

            const opts = (arr, label) => {{
                const sel = document.getElementById(label);
                sel.innerHTML = '<option value="">Todos</option>';
                arr.forEach(v => {{
                    const o = document.createElement('option');
                    o.value = v;
                    o.text = v + (label !== 'tipo' ? ' mm' : '');
                    sel.appendChild(o);
                }});
            }};

            opts(tipos, 'tipo');
            opts(anchos, 'ancho');
            opts(altos, 'alto');
            opts(espesores, 'espesor');
            opts(longitudes, 'longitud');

            filter();
        }}

        function filter() {{
            page = 1;
            const s = document.getElementById('search').value.toLowerCase();
            const t = document.getElementById('tipo').value;
            const a = document.getElementById('ancho').value;
            const al = document.getElementById('alto').value;
            const e = document.getElementById('espesor').value;
            const l = document.getElementById('longitud').value;

            filtered = DATA.filter(x => {{
                const ms = !s || x.ref.toLowerCase().includes(s) || x.descripcion.toLowerCase().includes(s);
                const mt = !t || x.tipo === t;
                const ma = !a || x.ancho == a;
                const mal = !al || x.alto == al;
                const me = !e || x.espesor == e;
                const ml = !l || x.longitud == l;
                return ms && mt && ma && mal && me && ml;
            }});

            document.getElementById('badge').textContent = filtered.length + ' perfiles';
            render();
        }}

        function render() {{
            const tb = document.getElementById('table');
            tb.innerHTML = '';
            const s = (page - 1) * perPage;
            const pdata = filtered.slice(s, s + perPage);
            const pk = parseFloat(document.getElementById('precio').value) || 6.00;

            pdata.forEach(x => {{
                const pm = (x.peso_kg_m * pk).toFixed(2);
                const ec = x.estado === 'Stock' ? 'status-stock' : x.estado === '7/10 Días' ? 'status-7dias' : 'status-sinstock';
                const tc = x.tar >= 10 ? 'qty-ok' : x.tar > 0 ? 'qty-low' : 'qty-none';
                const mc = x.mur >= 10 ? 'qty-ok' : x.mur > 0 ? 'qty-low' : 'qty-none';
                const vc = x.val >= 10 ? 'qty-ok' : x.val > 0 ? 'qty-low' : 'qty-none';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${{x.ref}}</td>
                    <td>${{x.descripcion}}</td>
                    <td>${{x.tipo}}</td>
                    <td>${{x.ancho || '-'}}</td>
                    <td>${{x.alto || '-'}}</td>
                    <td>${{x.espesor || '-'}}</td>
                    <td>${{x.longitud}}</td>
                    <td>${{x.peso_kg_m.toFixed(3)}}</td>
                    <td><strong>€${{pm}}</strong></td>
                    <td class="${{tc}}">${{x.tar}}</td>
                    <td class="${{mc}}">${{x.mur}}</td>
                    <td class="${{vc}}">${{x.val}}</td>
                    <td>${{x.tar + x.mur + x.val}}</td>
                    <td><span class="${{ec}}">${{x.estado}}</span></td>
                    <td><button class="btn-copy" onclick="copy('${{x.descripcion}}', ${{x.longitud}}, '${{pm}}', '${{x.estado}}')">📋</button></td>
                `;
                tb.appendChild(tr);
            }});

            const tp = Math.ceil(filtered.length / perPage);
            const pg = document.getElementById('pag');
            pg.innerHTML = '';
            for (let i = 1; i <= tp; i++) {{
                const b = document.createElement('button');
                b.textContent = i;
                b.onclick = () => {{ page = i; render(); }};
                if (i === page) b.classList.add('active');
                pg.appendChild(b);
            }}
        }}

        function reset() {{
            document.getElementById('search').value = '';
            document.getElementById('tipo').value = '';
            document.getElementById('ancho').value = '';
            document.getElementById('alto').value = '';
            document.getElementById('espesor').value = '';
            document.getElementById('longitud').value = '';
            document.getElementById('precio').value = '6.00';
            filter();
        }}

        function copy(d, l, p, e) {{
            const txt = d + ' — ' + l + 'mm — €' + p + '/m — ' + e;
            navigator.clipboard.writeText(txt);
            alert('Copiado');
        }}

        document.getElementById('precio').addEventListener('change', render);
        document.getElementById('precio').addEventListener('keyup', render);
    </script>
</body>
</html>
