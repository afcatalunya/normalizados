<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta Stock — Aluminios Franco</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#4A8C1C;--verde-d:#3A7015;--verde-l:#5EA02E;--g9:#111827;--g8:#1f2937;--g7:#374151;--g6:#4b5563;--g5:#6b7280;--stock:#22c55e;--dias:#f59e0b;--sinstock:#ef4444;--accent:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--g9);color:#e5e7eb;min-height:100vh}
.login-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:opacity .4s,visibility .4s}
.login-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.login-box{background:var(--g8);border:1px solid var(--g7);border-radius:20px;padding:44px 38px;width:370px;text-align:center}
.login-box img{height:55px;margin-bottom:20px}
.login-box h2{font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:6px}
.login-box p{font-size:.82rem;color:var(--g5);margin-bottom:22px}
.login-box input{width:100%;padding:13px 16px;background:var(--g9);border:1px solid var(--g7);border-radius:10px;color:#fff;font-family:'Outfit';font-size:.95rem;outline:none;transition:border .3s}
.login-box input:focus{border-color:var(--verde)}
.login-box .btn{width:100%;margin-top:14px;padding:13px;background:var(--verde);color:#fff;border:none;border-radius:10px;font-family:'Outfit';font-size:.95rem;font-weight:600;cursor:pointer;transition:background .3s}
.login-box .btn:hover{background:var(--verde-d)}
.login-error{color:var(--sinstock);font-size:.82rem;margin-top:8px;display:none}
.header-bar{background:var(--g8);border-bottom:1px solid var(--g7);padding:16px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-bar .left{display:flex;align-items:center;gap:14px}
.header-bar img{height:36px}
.header-bar .brand{font-size:1.1rem;font-weight:700;color:var(--verde-l)}
.header-bar .brand span{color:var(--g5);font-weight:400}
.count-badge{background:var(--verde);color:#fff;padding:3px 12px;border-radius:20px;font-size:.78rem;font-weight:600}
.filters{background:var(--g8);border-bottom:1px solid var(--g7);padding:16px 20px}
.filters-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.68rem;text-transform:uppercase;letter-spacing:.8px;color:var(--g5);font-weight:500}
.fg select,.fg input{padding:9px 12px;background:var(--g9);border:1px solid var(--g7);border-radius:8px;color:#fff;font-family:'Outfit';font-size:.85rem;outline:none;transition:border .3s;min-width:100px}
.fg select:focus,.fg input:focus{border-color:var(--verde)}
.fg .precio-input{width:90px;color:var(--accent);font-weight:600;border-color:var(--accent);text-align:center}
.fg .ref-input{width:200px}
.btn-clear{padding:9px 18px;background:transparent;border:1px solid var(--g7);border-radius:8px;color:var(--g5);font-family:'Outfit';font-size:.82rem;cursor:pointer;transition:all .3s;white-space:nowrap}
.btn-clear:hover{border-color:var(--sinstock);color:var(--sinstock)}
.btn-copy-all{padding:9px 18px;background:var(--verde);border:none;border-radius:8px;color:#fff;font-family:'Outfit';font-size:.82rem;font-weight:600;cursor:pointer;transition:all .3s;white-space:nowrap}
.btn-copy-all:hover{background:var(--verde-d)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead th{background:var(--g7);color:var(--g5);padding:10px 12px;text-align:left;font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:#fff}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
tbody tr:hover{background:rgba(74,140,28,.08)}
tbody td{padding:9px 12px;white-space:nowrap}
.td-ref{color:var(--verde-l);font-weight:500}
.td-tipo{display:inline-block;padding:2px 10px;border-radius:4px;background:rgba(74,140,28,.15);color:var(--verde-l);font-size:.72rem;font-weight:600}
.td-acabado{display:inline-block;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.08);font-size:.72rem}
.td-precio{color:var(--accent);font-weight:700}
.td-stock{font-weight:600}
.td-stock.green{color:var(--stock)}.td-stock.orange{color:var(--dias)}.td-stock.red{color:var(--sinstock)}.td-stock.zero{color:var(--g6)}
.td-total{color:#fff;font-weight:700}
.btn-copy{padding:3px 10px;background:transparent;border:1px solid var(--g7);border-radius:6px;color:var(--g5);font-family:'Outfit';font-size:.7rem;cursor:pointer;transition:all .2s}
.btn-copy:hover{border-color:var(--verde-l);color:var(--verde-l)}
.btn-copy.copied{border-color:var(--stock);color:var(--stock)}
.pagination{display:flex;justify-content:center;gap:4px;padding:16px;background:var(--g8);border-top:1px solid var(--g7)}
.pagination button{padding:7px 12px;border:1px solid var(--g7);border-radius:6px;background:transparent;color:var(--g5);font-family:'Outfit';font-size:.78rem;cursor:pointer;transition:all .2s}
.pagination button.active{background:var(--verde);color:#fff;border-color:var(--verde)}
.pagination button:hover:not(.active){border-color:var(--g5)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--stock);color:#fff;padding:10px 24px;border-radius:10px;font-size:.85rem;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.cards-container{display:none;padding:10px}
.card{background:var(--g8);border:1px solid var(--g7);border-radius:12px;padding:14px;margin-bottom:10px}
.card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}
.card-ref{color:var(--verde-l);font-weight:600;font-size:.82rem}
.card-desc{color:#fff;font-weight:500;font-size:.88rem;margin-bottom:6px}
.card-tipo{display:inline-block;padding:2px 10px;border-radius:4px;background:rgba(74,140,28,.15);color:var(--verde-l);font-size:.7rem;font-weight:600}
.card-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.card-field{display:flex;flex-direction:column}
.card-field .lbl{font-size:.62rem;text-transform:uppercase;color:var(--g5);letter-spacing:.5px}
.card-field .val{font-size:.82rem;font-weight:500;color:#e5e7eb}
.card-precio{color:var(--accent);font-weight:700;font-size:1rem;margin:8px 0 4px}
.card-stock{display:flex;gap:12px;margin:8px 0;flex-wrap:wrap}
.card-stock-item{display:flex;flex-direction:column;align-items:center}
.card-stock-item .lbl{font-size:.6rem;text-transform:uppercase;color:var(--g5)}
.card-stock-item .val{font-weight:700;font-size:.9rem}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--g7)}
.card-estado{padding:4px 12px;border-radius:16px;font-size:.72rem;font-weight:600}
.card-estado.st-stock{background:rgba(34,197,94,.15);color:var(--stock)}
.card-estado.st-dias{background:rgba(245,158,11,.15);color:var(--dias)}
.card-estado.st-sin{background:rgba(239,68,68,.15);color:var(--sinstock)}
.card-copy{padding:6px 14px;background:transparent;border:1px solid var(--g7);border-radius:8px;color:var(--g5);font-family:'Outfit';font-size:.75rem;cursor:pointer}
.card-copy:active{border-color:var(--stock);color:var(--stock)}
@media(max-width:768px){
  .header-bar{padding:12px 16px}.header-bar .brand{font-size:.95rem}
  .filters{padding:12px 16px}.filters-row{gap:8px}
  .fg select,.fg input{min-width:0;padding:8px 10px;font-size:.82rem}
  .fg .ref-input{width:100%}.fg .precio-input{width:70px}
  .fg{flex:1;min-width:calc(50% - 8px)}.fg label{font-size:.6rem}
  .btn-clear,.btn-copy-all{flex:1;text-align:center;padding:10px}
  .table-wrap{display:none}.cards-container{display:block}
  .pagination{flex-wrap:wrap}.login-box{width:90%;padding:30px 24px}
}
</style>
</head>

const PER_PAGE=40;let filtered=[...DATA];let page=1;let sortCol='',sortAsc=true;
function doLogin(){const p=document.getElementById('loginPass').value;if(p==='Murcia'){sessionStorage.setItem('af_login','1');document.getElementById('loginOverlay').classList.add('hidden')}else{document.getElementById('loginErr').style.display='block'}}
if(sessionStorage.getItem('af_login')==='1')document.getElementById('loginOverlay').classList.add('hidden');
function getPrecio(){const v=document.getElementById('precioKg').value.replace(',','.');const p=parseFloat(v);return isNaN(p)?0:p}
function calcPM(r){const pkg=getPrecio();if(pkg<=0)return null;return Math.round(r.peso_kg_m*pkg*100)/100}
function initPrecio(){const s=sessionStorage.getItem('af_precio_kg');if(s)document.getElementById('precioKg').value=s;document.getElementById('precioKg').addEventListener('input',function(){sessionStorage.setItem('af_precio_kg',this.value);render()})}
function populateFilters(){
  const tipos=new Set(),longs=new Set();
  DATA.forEach(r=>{tipos.add(r.tipo);longs.add(r.longitud)});
  const s1=document.getElementById('fTipo');[...tipos].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s1.appendChild(o)});
  const s2=document.getElementById('fLong');[...longs].sort((a,b)=>a-b).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s2.appendChild(o)});
  ['fTipo','fLong'].forEach(id=>document.getElementById(id).addEventListener('change',applyFilters));
  ['fSearch','fAlto','fAncho','fEspesor'].forEach(id=>{let t;document.getElementById(id).addEventListener('input',()=>{clearTimeout(t);t=setTimeout(applyFilters,300)})});
}
function applyFilters(){
  const s=document.getElementById('fSearch').value.toLowerCase().trim();
  const t=document.getElementById('fTipo').value;
  const al=document.getElementById('fAlto').value.trim();
  const a=document.getElementById('fAncho').value.trim();
  const e=document.getElementById('fEspesor').value.trim();
  const l=document.getElementById('fLong').value;
  filtered=DATA.filter(r=>{
    if(s&&!r.ref.toLowerCase().includes(s)&&!r.descripcion.toLowerCase().includes(s))return false;
    if(t&&r.tipo!==t)return false;if(a&&r.ancho!=parseFloat(a))return false;
    if(al&&r.alto!=parseFloat(al))return false;if(e&&r.espesor!=parseFloat(e))return false;
    if(l&&r.longitud!=parseInt(l))return false;return true;
  });page=1;render();
}
function sortBy(col){if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true}
  filtered.sort((a,b)=>{let va=a[col],vb=b[col];if(va===null)va=-Infinity;if(vb===null)vb=-Infinity;if(typeof va==='string')return sortAsc?va.localeCompare(vb):vb.localeCompare(va);return sortAsc?va-vb:vb-va});render()}
function render(){
  const start=(page-1)*PER_PAGE;const slice=filtered.slice(start,start+PER_PAGE);
  document.getElementById('countBadge').textContent=filtered.length+' REGISTROS ENCONTRADOS';
  document.getElementById('tbody').innerHTML=slice.map((r,i)=>{
    const pm=calcPM(r);const pmStr=pm!==null?pm.toFixed(2):'—';
    const total=r.tar+r.mur+r.val;const sc=v=>v>=10?'green':v>0?'orange':'zero';
    const av=r.ancho!==null?r.ancho:'';const alv=r.alto!==null?r.alto:'';const ev=r.espesor!==null?r.espesor:'';
    const longM=(r.longitud/1000).toFixed(2)+'m';
    return `<tr><td class="td-ref">${r.ref}</td><td>${r.descripcion}</td><td><span class="td-tipo">${r.tipo}</span></td><td>${alv}</td><td>${av}</td><td>${ev}</td><td>${longM}</td><td><span class="td-acabado">${r.acabado}</span></td><td>${r.peso_kg_m}</td><td class="td-precio">${pmStr}</td><td class="td-stock ${sc(r.tar)}">${r.tar||'—'}</td><td class="td-stock ${sc(r.mur)}">${r.mur||'—'}</td><td class="td-stock ${sc(r.val)}">${r.val||'—'}</td><td class="td-total">${total}</td><td><button class="btn-copy" onclick="copyRow(this,${start+i})">📋</button></td></tr>`;
  }).join('');
  document.getElementById('cards').innerHTML=slice.map((r,i)=>{
    const pm=calcPM(r);const pmStr=pm!==null?pm.toFixed(2)+' €/m':'—';
    const total=r.tar+r.mur+r.val;const sc=v=>v>=10?'green':v>0?'orange':'zero';
    const ec=r.estado==='Stock'?'st-stock':r.estado==='7/10 Días'?'st-dias':'st-sin';
    const av=r.ancho!==null?r.ancho:'—';const alv=r.alto!==null?r.alto:'—';const ev=r.espesor!==null?r.espesor:'—';
    const longM=(r.longitud/1000).toFixed(2)+'m';
    return `<div class="card"><div class="card-header"><div><span class="card-ref">${r.ref}</span><span class="card-tipo" style="margin-left:8px">${r.tipo}</span></div><button class="card-copy" onclick="copyRow(this,${start+i})">📋 Copiar</button></div><div class="card-desc">${r.descripcion}</div><div class="card-grid"><div class="card-field"><span class="lbl">Alto</span><span class="val">${alv}</span></div><div class="card-field"><span class="lbl">Ancho</span><span class="val">${av}</span></div><div class="card-field"><span class="lbl">Espesor</span><span class="val">${ev}</span></div><div class="card-field"><span class="lbl">Longitud</span><span class="val">${longM}</span></div><div class="card-field"><span class="lbl">Kg/m</span><span class="val">${r.peso_kg_m}</span></div><div class="card-field"><span class="lbl">Acabado</span><span class="val">${r.acabado}</span></div></div><div class="card-precio">${pmStr}</div><div class="card-stock"><div class="card-stock-item"><span class="lbl">Tarragona</span><span class="val td-stock ${sc(r.tar)}">${r.tar||'—'}</span></div><div class="card-stock-item"><span class="lbl">Murcia</span><span class="val td-stock ${sc(r.mur)}">${r.mur||'—'}</span></div><div class="card-stock-item"><span class="lbl">Valencia</span><span class="val td-stock ${sc(r.val)}">${r.val||'—'}</span></div><div class="card-stock-item"><span class="lbl">Total</span><span class="val" style="color:#fff;font-weight:700">${total}</span></div></div><div class="card-footer"><span class="card-estado ${ec}">${r.estado}</span></div></div>`;
  }).join('');
  const tp=Math.ceil(filtered.length/PER_PAGE);const pag=document.getElementById('pagination');
  if(tp<=1){pag.innerHTML='';return}let h='';const s2=Math.max(1,page-3),e2=Math.min(tp,page+3);
  if(s2>1)h+='<button onclick="goPage(1)">1</button>';if(s2>2)h+='<button disabled>…</button>';
  for(let i=s2;i<=e2;i++)h+=`<button class="${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if(e2<tp-1)h+='<button disabled>…</button>';if(e2<tp)h+=`<button onclick="goPage(${tp})">${tp}</button>`;pag.innerHTML=h;
}
function goPage(p){page=p;render();window.scrollTo(0,0)}
function copyRow(btn,idx){const r=filtered[idx];const pm=calcPM(r);const pmStr=pm!==null?pm.toFixed(2)+' €/m':'—';
  navigator.clipboard.writeText(r.descripcion+' — '+pmStr+' — '+r.estado).then(()=>{btn.classList.add('copied');btn.textContent='✓';setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋'},1500)})}
function copyAll(){const pkg=getPrecio();const lines=filtered.map(r=>{const pm=pkg>0?Math.round(r.peso_kg_m*pkg*100)/100:0;const pmStr=pkg>0?pm.toFixed(2)+' €/m':'—';return r.descripcion+'\t'+pmStr+'\t'+r.estado});
  navigator.clipboard.writeText(lines.join('\n')).then(()=>{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)})}
function limpiar(){['fSearch','fAlto','fAncho','fEspesor'].forEach(id=>document.getElementById(id).value='');['fTipo','fLong'].forEach(id=>document.getElementById(id).value='');filtered=[...DATA];page=1;render()}
populateFilters();initPrecio();applyFilters();
</script></body></html>
