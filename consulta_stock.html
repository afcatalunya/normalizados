<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aluminios Franco · Consulta de Stock</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117;--surface:#181c26;--surface2:#1e2333;--border:#2a2f42;
    --accent:#e8a020;--accent2:#f0c060;--text:#e2e6f0;--muted:#7a8099;
    --tarragona:#3b82f6;--murcia:#22c55e;--valencia:#f97316;--red:#ef4444;--precio:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-weight:300;min-height:100vh;}
  header{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:52px;}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
  .logo span{color:var(--text);font-weight:400;}
  .hdr{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
  #total-count{color:var(--accent);font-weight:700;}
  .fw{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .fg{display:flex;flex-direction:column;gap:4px;}
  label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:6px 10px;border-radius:4px;outline:none;transition:border-color .2s;}
  input:focus,select:focus{border-color:var(--accent);}
  input::placeholder{color:var(--muted);}
  #search-main{width:250px;}
  #filter-tipo,#filter-acabado,#filter-almacen{width:160px;}
  .di{width:76px;}
  .pi{width:100px;border-color:var(--precio)!important;color:var(--precio)!important;}
  .pi:focus{box-shadow:0 0 0 2px rgba(167,139,250,.15);}
  .fdiv{width:1px;background:var(--border);height:32px;align-self:flex-end;margin:0 2px;}
  .btn-r{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .2s;height:32px;align-self:flex-end;}
  .btn-r:hover{border-color:var(--red);color:var(--red);}
  .btn-c{background:var(--surface2);border:1px solid var(--accent);color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 16px;border-radius:4px;cursor:pointer;transition:all .2s;height:32px;align-self:flex-end;}
  .btn-c:hover{background:var(--accent);color:#000;}
  .btn-c.copied{background:var(--murcia);border-color:var(--murcia);color:#000;}
  .tw{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 175px);padding:0 32px 40px;}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  thead th{position:sticky;top:0;z-index:50;background:var(--surface2);border-bottom:2px solid var(--border);padding:9px 10px;text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none;transition:color .15s;}
  thead th:hover,thead th.sorted{color:var(--accent);}
  thead th .sa{margin-left:3px;opacity:.4;}
  thead th.sorted .sa{opacity:1;}
  .th-t{box-shadow:inset 0 3px 0 var(--tarragona);}
  .th-m{box-shadow:inset 0 3px 0 var(--murcia);}
  .th-v{box-shadow:inset 0 3px 0 var(--valencia);}
  .th-tot{box-shadow:inset 0 3px 0 var(--accent);}
  .th-p{box-shadow:inset 0 3px 0 var(--precio);}
  tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
  tbody tr:hover{background:var(--surface2);}
  tbody td{padding:7px 10px;vertical-align:middle;white-space:nowrap;}
  .r{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);}
  .ds{font-weight:500;max-width:220px;white-space:normal;}
  .tp{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);color:var(--accent2);}
  .dm{font-family:'Barlow Condensed',sans-serif;font-size:13px;text-align:right;}
  .lg{font-family:'Barlow Condensed',sans-serif;color:var(--muted);font-size:12px;}
  .ac{font-family:'Barlow Condensed',sans-serif;font-size:10px;background:var(--bg);border:1px solid var(--border);padding:2px 6px;border-radius:3px;}
  .ps{font-family:'Barlow Condensed',sans-serif;color:var(--muted);font-size:12px;text-align:right;}
  .sc{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;min-width:50px;}
  .sc.z{color:var(--border);font-weight:400;font-size:12px;}
  .st{color:var(--tarragona);}
  .sm{color:var(--murcia);}
  .sv{color:var(--valencia);}
  .stot{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;color:var(--accent);}
  .stot.z{color:var(--red);font-weight:400;font-size:12px;}
  .pm{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--precio);text-align:right;}
  .pm.e{color:var(--border);font-size:12px;font-weight:400;}
  #loading{text-align:center;padding:80px;font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
  .nr{text-align:center;padding:80px 20px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:2px;text-transform:uppercase;}
  .nr span{display:block;font-size:40px;margin-bottom:10px;opacity:.15;}
  .pg{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 32px;border-top:1px solid var(--border);}
  .pb{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;padding:5px 12px;border-radius:3px;cursor:pointer;transition:all .15s;}
  .pb:hover,.pb.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
  .pb:disabled{opacity:.3;cursor:default;background:var(--surface2);color:var(--muted);}
  .pi2{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);letter-spacing:1px;}
</style>
</head>
<body>
<header>
  <div class="logo">Aluminios Franco <span>· Stock</span></div>
  <div class="hdr"><span id="total-count">—</span> registros encontrados</div>
</header>

<div class="fw">
  <div class="fg"><label>Referencia / Descripción</label><input type="text" id="search-main" placeholder="NOI0088400, ANGULO 60..." autocomplete="off"></div>
  <div class="fg"><label>Tipo</label><select id="filter-tipo"><option value="">Todos</option></select></div>
  <div class="fdiv"></div>
  <div class="fg"><label>Ancho</label><input type="number" class="di" id="filter-ancho" placeholder="ej: 40" step="any"></div>
  <div class="fg"><label>Alto</label><input type="number" class="di" id="filter-alto" placeholder="ej: 20" step="any"></div>
  <div class="fg"><label>Espesor</label><input type="number" class="di" id="filter-espesor" placeholder="ej: 2" step="any"></div>
  <div class="fdiv"></div>
  <div class="fg"><label>Acabado</label><select id="filter-acabado"><option value="">Todos</option></select></div>
  <div class="fg"><label>Almacén con stock</label><select id="filter-almacen"><option value="">Todos</option><option value="tarragona">Tarragona</option><option value="murcia">Murcia</option><option value="valencia">Valencia</option></select></div>
  <div class="fdiv"></div>
  <div class="fg"><label>Precio €/kg</label><input type="number" class="pi" id="input-precio" placeholder="ej: 2.50" step="0.01" min="0"></div>
  <button class="btn-r" onclick="resetFilters()">✕ Limpiar</button>
  <button class="btn-c" id="btn-copy" onclick="copyResults()">⎘ Copiar resultados</button>
</div>

<div id="loading">⟳ Cargando inventario...</div>
<div class="tw" id="tc" style="display:none">
  <table id="mt">
    <thead><tr>
      <th onclick="sb('ref')" data-col="ref">Referencia <span class="sa">↕</span></th>
      <th onclick="sb('desc')" data-col="desc">Descripción <span class="sa">↕</span></th>
      <th onclick="sb('tipo')" data-col="tipo">Tipo <span class="sa">↕</span></th>
      <th onclick="sb('ancho')" data-col="ancho">Ancho <span class="sa">↕</span></th>
      <th onclick="sb('alto')" data-col="alto">Alto <span class="sa">↕</span></th>
      <th onclick="sb('espesor')" data-col="espesor">Espesor <span class="sa">↕</span></th>
      <th onclick="sb('longitud')" data-col="longitud">Long. <span class="sa">↕</span></th>
      <th onclick="sb('acabado')" data-col="acabado">Acabado <span class="sa">↕</span></th>
      <th onclick="sb('peso_kg_m')" data-col="peso_kg_m">kg/m <span class="sa">↕</span></th>
      <th onclick="sb('precio_metro')" data-col="precio_metro" class="th-p">€/m <span class="sa">↕</span></th>
      <th onclick="sb('stock_tarragona')" data-col="stock_tarragona" class="th-t">Tarragona <span class="sa">↕</span></th>
      <th onclick="sb('stock_murcia')" data-col="stock_murcia" class="th-m">Murcia <span class="sa">↕</span></th>
      <th onclick="sb('stock_valencia')" data-col="stock_valencia" class="th-v">Valencia <span class="sa">↕</span></th>
      <th onclick="sb('total')" data-col="total" class="th-tot">Total <span class="sa">↕</span></th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div id="nr" class="nr" style="display:none"><span>◻</span>SIN RESULTADOS</div>
</div>
<div class="pg" id="pg"></div>

<script>
let allData=[],filtered=[],sortCol='desc',sortDir=1,page=0;
const PS=50;

fetch('inventario.json').then(r=>r.json()).then(data=>{
  allData=data;buildFilters();applyFilters();
  document.getElementById('loading').style.display='none';
  document.getElementById('tc').style.display='block';
}).catch(()=>{ document.getElementById('loading').textContent='⚠ No se pudo cargar inventario.json'; });

function buildFilters(){
  const tipos=[...new Set(allData.map(d=>d.tipo))].filter(Boolean).sort();
  const sT=document.getElementById('filter-tipo');
  tipos.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sT.appendChild(o);});
  const acabados=[...new Set(allData.map(d=>d.acabado))].filter(Boolean).sort();
  const sA=document.getElementById('filter-acabado');
  acabados.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;sA.appendChild(o);});
}

function getPrecio(){const v=parseFloat(document.getElementById('input-precio').value);return(isNaN(v)||v<=0)?null:v;}

function applyFilters(){
  const q=document.getElementById('search-main').value.trim().toLowerCase();
  const tipo=document.getElementById('filter-tipo').value;
  const alm=document.getElementById('filter-almacen').value;
  const acab=document.getElementById('filter-acabado').value;
  const ancho=document.getElementById('filter-ancho').value.trim();
  const alto=document.getElementById('filter-alto').value.trim();
  const esp=document.getElementById('filter-espesor').value.trim();
  filtered=allData.filter(d=>{
    if(q&&!d.ref.toLowerCase().includes(q)&&!d.desc.toLowerCase().includes(q))return false;
    if(tipo&&d.tipo!==tipo)return false;
    if(acab&&d.acabado!==acab)return false;
    if(alm==='tarragona'&&d.stock_tarragona<=0)return false;
    if(alm==='murcia'&&d.stock_murcia<=0)return false;
    if(alm==='valencia'&&d.stock_valencia<=0)return false;
    if(ancho&&parseFloat(ancho)!==d.ancho)return false;
    if(alto&&parseFloat(alto)!==d.alto)return false;
    if(esp&&parseFloat(esp)!==d.espesor)return false;
    return true;
  });
  sortData();page=0;
  document.getElementById('total-count').textContent=filtered.length.toLocaleString('es');
  renderPage();
}

function sortData(){
  const p=getPrecio();
  filtered.sort((a,b)=>{
    let va,vb;
    if(sortCol==='total'){va=a.stock_tarragona+a.stock_murcia+a.stock_valencia;vb=b.stock_tarragona+b.stock_murcia+b.stock_valencia;}
    else if(sortCol==='precio_metro'){va=p&&a.peso_kg_m?p*a.peso_kg_m:null;vb=p&&b.peso_kg_m?p*b.peso_kg_m:null;}
    else{va=a[sortCol];vb=b[sortCol];}
    const inf=sortDir>0?Infinity:-Infinity;
    if(va===null||va===undefined)va=inf;
    if(vb===null||vb===undefined)vb=inf;
    if(typeof va==='string')return va.localeCompare(vb)*sortDir;
    return(va-vb)*sortDir;
  });
}

function sb(col){
  if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}
  document.querySelectorAll('thead th').forEach(th=>{th.classList.remove('sorted');const s=th.querySelector('.sa');if(s)s.textContent='↕';});
  const th=document.querySelector(`th[data-col="${col}"]`);
  if(th){th.classList.add('sorted');th.querySelector('.sa').textContent=sortDir>0?'↑':'↓';}
  sortData();page=0;renderPage();
}

function f(v){return(v!==null&&v!==undefined)?v:'—';}

function renderPage(){
  const tb=document.getElementById('tb');
  const rows=filtered.slice(page*PS,(page+1)*PS);
  const p=getPrecio();
  if(filtered.length===0){tb.innerHTML='';document.getElementById('nr').style.display='block';document.getElementById('pg').innerHTML='';return;}
  document.getElementById('nr').style.display='none';
  tb.innerHTML=rows.map(d=>{
    const tot=d.stock_tarragona+d.stock_murcia+d.stock_valencia;
    const pm=p&&d.peso_kg_m?p*d.peso_kg_m:null;
    return`<tr>
      <td class="r">${d.ref}</td>
      <td class="ds">${d.desc}</td>
      <td><span class="tp">${d.tipo}</span></td>
      <td class="dm">${f(d.ancho)}</td>
      <td class="dm">${f(d.alto)}</td>
      <td class="dm">${f(d.espesor)}</td>
      <td class="lg">${d.longitud?(d.longitud/1000).toFixed(2)+'m':'—'}</td>
      <td><span class="ac">${d.acabado}</span></td>
      <td class="ps">${d.peso_kg_m!==null?d.peso_kg_m.toFixed(3):'—'}</td>
      <td class="pm${pm===null?' e':''}">${pm!==null?pm.toFixed(3)+' €':'—'}</td>
      <td class="sc${d.stock_tarragona>0?' st':' z'}">${d.stock_tarragona>0?d.stock_tarragona:'—'}</td>
      <td class="sc${d.stock_murcia>0?' sm':' z'}">${d.stock_murcia>0?d.stock_murcia:'—'}</td>
      <td class="sc${d.stock_valencia>0?' sv':' z'}">${d.stock_valencia>0?d.stock_valencia:'—'}</td>
      <td class="stot${tot===0?' z':''}">${tot>0?tot:'0'}</td>
    </tr>`;
  }).join('');
  renderPagination();
}

function renderPagination(){
  const total=Math.ceil(filtered.length/PS);
  if(total<=1){document.getElementById('pg').innerHTML='';return;}
  let h=`<button class="pb" onclick="gp(${page-1})" ${page===0?'disabled':''}>← Ant</button>`;
  const s=Math.max(0,page-2),e=Math.min(total-1,page+2);
  if(s>0)h+=`<button class="pb" onclick="gp(0)">1</button><span class="pi2">…</span>`;
  for(let i=s;i<=e;i++)h+=`<button class="pb${i===page?' active':''}" onclick="gp(${i})">${i+1}</button>`;
  if(e<total-1)h+=`<span class="pi2">…</span><button class="pb" onclick="gp(${total-1})">${total}</button>`;
  h+=`<button class="pb" onclick="gp(${page+1})" ${page===total-1?'disabled':''}>Sig →</button>`;
  h+=`<span class="pi2">${page*PS+1}–${Math.min((page+1)*PS,filtered.length)} de ${filtered.length}</span>`;
  document.getElementById('pg').innerHTML=h;
}

function gp(p){page=p;renderPage();window.scrollTo({top:0,behavior:'smooth'});}

function resetFilters(){
  ['search-main','filter-tipo','filter-almacen','filter-acabado','filter-ancho','filter-alto','filter-espesor','input-precio'].forEach(id=>{
    const el=document.getElementById(id);el.value='';
  });
  applyFilters();
}

function copyResults(){
  const p=getPrecio();
  const precioLabel = '€/m';

  // --- HTML table (rich format for Word/Outlook/Gmail) ---
  const tdStyle = 'padding:6px 14px;border:1px solid #ccc;text-align:center;font-family:Arial,sans-serif;font-size:13px;';
  const thStyle = 'padding:7px 14px;border:1px solid #999;text-align:center;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;background:#f0f0f0;';

  let html = `<table style="border-collapse:collapse;margin:0 auto;">`;
  html += `<thead><tr>`;
  html += `<th style="${thStyle}">Descripción</th>`;
  html += `<th style="${thStyle}">Acabado</th>`;
  html += `<th style="${thStyle}">${precioLabel}</th>`;
  html += `</tr></thead><tbody>`;

  filtered.forEach((d,i) => {
    const pm = p && d.peso_kg_m ? (p * d.peso_kg_m).toFixed(3) + ' €' : '—';
    const bg = i % 2 === 0 ? '#ffffff' : '#f7f7f7';
    const rowStyle = `background:${bg};`;
    html += `<tr style="${rowStyle}">`;
    html += `<td style="${tdStyle}text-align:left;">${d.desc}</td>`;
    html += `<td style="${tdStyle}">${d.acabado}</td>`;
    html += `<td style="${tdStyle}text-align:right;font-weight:bold;">${pm}</td>`;
    html += `</tr>`;
  });
  html += `</tbody></table>`;

  // --- Plain text fallback (TSV for Excel) ---
  const lines = [['Descripción','Acabado',precioLabel].join('\t')];
  filtered.forEach(d => {
    const pm = p && d.peso_kg_m ? (p * d.peso_kg_m).toFixed(3) : '';
    lines.push([d.desc, d.acabado, pm].join('\t'));
  });
  const plain = lines.join('\n');

  const done = () => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = `✓ Copiado (${filtered.length} filas)`;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '⎘ Copiar resultados'; btn.classList.remove('copied'); }, 2500);
  };

  // Try rich copy (HTML + plain) via ClipboardItem
  if (navigator.clipboard && window.ClipboardItem) {
    const htmlBlob  = new Blob([html],  { type: 'text/html' });
    const plainBlob = new Blob([plain], { type: 'text/plain' });
    navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': plainBlob })])
      .then(done)
      .catch(() => fallbackCopy(plain, done));
  } else {
    fallbackCopy(plain, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
  done();
}

['search-main','filter-tipo','filter-almacen','filter-acabado','filter-ancho','filter-alto','filter-espesor','input-precio'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener(el.tagName==='SELECT'?'change':'input',applyFilters);
});
</script>
</body>
</html>
