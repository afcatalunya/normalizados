<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aluminios Franco · Consulta de Stock</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c26;
    --surface2: #1e2333;
    --border: #2a2f42;
    --accent: #e8a020;
    --accent2: #f0c060;
    --text: #e2e6f0;
    --muted: #7a8099;
    --tarragona: #3b82f6;
    --murcia: #22c55e;
    --valencia: #f97316;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .logo span { color: var(--text); font-weight: 400; }
  .header-right {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }
  #total-count {
    color: var(--accent);
    font-weight: 700;
  }

  /* SEARCH BAR */
  .search-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .search-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  input, select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  #search-main { width: 340px; }
  #filter-tipo { width: 200px; }
  #filter-almacen { width: 180px; }
  #filter-acabado { width: 180px; }
  .btn-reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    height: 36px;
    align-self: flex-end;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat-item {
    flex: 1;
    background: var(--surface2);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stat-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .stat-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-left: auto;
  }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
    overflow-y: auto;
    max-height: calc(100vh - 220px);
    padding: 0 32px 40px;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    margin-top: 0;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--surface2);
    border-bottom: 2px solid var(--border);
    border-top: none;
    padding: 10px 10px;
    text-align: left;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    transition: color 0.15s;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--surface2); }
  tbody td {
    padding: 9px 10px;
    vertical-align: middle;
    white-space: nowrap;
  }
  .td-ref {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .td-desc {
    font-weight: 500;
    color: var(--text);
    max-width: 280px;
    white-space: normal;
  }
  .td-tipo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent2);
    white-space: nowrap;
  }
  .td-dim {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: var(--text);
  }
  .td-longitud {
    font-family: 'Barlow Condensed', sans-serif;
    color: var(--muted);
    font-size: 12px;
  }
  .td-acabado {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 3px;
    color: var(--text);
    white-space: nowrap;
  }
  .td-peso {
    font-family: 'Barlow Condensed', sans-serif;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
  }

  /* STOCK CELLS */
  .stock-cell {
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    min-width: 60px;
  }
  .stock-cell.zero { color: var(--border); font-weight: 400; font-size: 13px; }
  .stock-tarragona { color: var(--tarragona); }
  .stock-murcia    { color: var(--murcia); }
  .stock-valencia  { color: var(--valencia); }

  /* TOTAL STOCK */
  .stock-total {
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 900;
    color: var(--accent);
  }
  .stock-total.zero { color: var(--red); font-weight: 400; font-size: 13px; }

  /* COLUMN HEADERS color indicators */
  .th-tarragona { box-shadow: inset 0 3px 0 var(--tarragona); }
  .th-murcia    { box-shadow: inset 0 3px 0 var(--murcia); }
  .th-valencia  { box-shadow: inset 0 3px 0 var(--valencia); }
  .th-total     { box-shadow: inset 0 3px 0 var(--accent); }
  
  thead th:hover { color: var(--accent); }
  thead th.sorted { color: var(--accent); }
  thead th .sort-arrow { margin-left: 4px; opacity: 0.5; }
  thead th.sorted .sort-arrow { opacity: 1; }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .no-results span { display: block; font-size: 48px; margin-bottom: 12px; opacity: 0.2; }

  /* LOADING */
  #loading {
    text-align: center;
    padding: 80px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* PAGINATION */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px 32px;
    border-top: 1px solid var(--border);
  }
  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .page-btn:hover, .page-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .page-btn:disabled { opacity: 0.3; cursor: default; }
  .page-info {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  @media (max-width: 768px) {
    .search-wrap { padding: 16px; flex-direction: column; }
    #search-main { width: 100%; }
    .table-wrap { padding: 0 8px 40px; }
    header { padding: 0 16px; }
    .stats-bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Aluminios Franco <span>· Stock</span></div>
  <div class="header-right">
    <span id="total-count">—</span> registros encontrados
  </div>
</header>

<div class="search-wrap">
  <div class="search-group">
    <label>Buscar referencia o descripción</label>
    <input type="text" id="search-main" placeholder="Ej: NOI0088400, ANGULO 60, PLETINA 50..." autocomplete="off">
  </div>
  <div class="search-group">
    <label>Tipo</label>
    <select id="filter-tipo">
      <option value="">Todos</option>
    </select>
  </div>
  <div class="search-group">
    <label>Almacén con stock</label>
    <select id="filter-almacen">
      <option value="">Todos</option>
      <option value="tarragona">Tarragona</option>
      <option value="murcia">Murcia</option>
      <option value="valencia">Valencia</option>
    </select>
  </div>
  <div class="search-group">
    <label>Acabado</label>
    <select id="filter-acabado">
      <option value="">Todos</option>
    </select>
  </div>
  <button class="btn-reset" onclick="resetFilters()">✕ Limpiar</button>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-dot" style="background:var(--tarragona)"></div>
    <span class="stat-label">Tarragona</span>
    <span class="stat-value" id="stat-tarragona" style="color:var(--tarragona)">—</span>
  </div>
  <div class="stat-item">
    <div class="stat-dot" style="background:var(--murcia)"></div>
    <span class="stat-label">Murcia</span>
    <span class="stat-value" id="stat-murcia" style="color:var(--murcia)">—</span>
  </div>
  <div class="stat-item">
    <div class="stat-dot" style="background:var(--valencia)"></div>
    <span class="stat-label">Valencia</span>
    <span class="stat-value" id="stat-valencia" style="color:var(--valencia)">—</span>
  </div>
  <div class="stat-item">
    <div class="stat-dot" style="background:var(--accent)"></div>
    <span class="stat-label">Total barras</span>
    <span class="stat-value" id="stat-total" style="color:var(--accent)">—</span>
  </div>
</div>

<div id="loading">⟳ Cargando inventario...</div>

<div class="table-wrap" id="table-container" style="display:none">
  <table id="main-table">
    <thead>
      <tr>
        <th onclick="sortBy('ref')" data-col="ref">Referencia <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('desc')" data-col="desc">Descripción <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('tipo')" data-col="tipo">Tipo <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('ancho')" data-col="ancho">Ancho <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('alto')" data-col="alto">Alto <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('espesor')" data-col="espesor">Espesor <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('longitud')" data-col="longitud">Long. <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('acabado')" data-col="acabado">Acabado <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('peso_kg_m')" data-col="peso_kg_m">kg/m <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('stock_tarragona')" data-col="stock_tarragona" class="th-tarragona">Tarragona <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('stock_murcia')" data-col="stock_murcia" class="th-murcia">Murcia <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('stock_valencia')" data-col="stock_valencia" class="th-valencia">Valencia <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('total')" data-col="total" class="th-total">Total <span class="sort-arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div id="no-results" class="no-results" style="display:none">
    <span>◻</span>SIN RESULTADOS
  </div>
</div>

<div class="pagination" id="pagination"></div>

<script>
let allData = [];
let filtered = [];
let sortCol = 'desc';
let sortDir = 1;
let page = 0;
const PAGE_SIZE = 50;

// Load JSON (same folder)
fetch('inventario.json')
  .then(r => r.json())
  .then(data => {
    allData = data;
    buildFilters();
    applyFilters();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-container').style.display = 'block';
  })
  .catch(() => {
    document.getElementById('loading').textContent = '⚠ No se pudo cargar inventario.json — asegúrate de que esté en la misma carpeta.';
  });

function buildFilters() {
  const tipos = [...new Set(allData.map(d => d.tipo))].filter(Boolean).sort();
  const sel = document.getElementById('filter-tipo');
  tipos.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  });

  const acabados = [...new Set(allData.map(d => d.acabado))].filter(Boolean).sort();
  const sel2 = document.getElementById('filter-acabado');
  acabados.forEach(a => {
    const o = document.createElement('option');
    o.value = a; o.textContent = a;
    sel2.appendChild(o);
  });
}

function applyFilters() {
  const q = document.getElementById('search-main').value.trim().toLowerCase();
  const tipo = document.getElementById('filter-tipo').value;
  const almacen = document.getElementById('filter-almacen').value;
  const acabado = document.getElementById('filter-acabado').value;

  filtered = allData.filter(d => {
    if (q && !d.ref.toLowerCase().includes(q) && !d.desc.toLowerCase().includes(q)) return false;
    if (tipo && d.tipo !== tipo) return false;
    if (acabado && d.acabado !== acabado) return false;
    if (almacen === 'tarragona' && d.stock_tarragona <= 0) return false;
    if (almacen === 'murcia'    && d.stock_murcia <= 0)    return false;
    if (almacen === 'valencia'  && d.stock_valencia <= 0)  return false;
    return true;
  });

  sortData();
  page = 0;
  updateStats();
  renderPage();
}

function sortData() {
  filtered.sort((a, b) => {
    let va = sortCol === 'total' ? (a.stock_tarragona + a.stock_murcia + a.stock_valencia) : a[sortCol];
    let vb = sortCol === 'total' ? (b.stock_tarragona + b.stock_murcia + b.stock_valencia) : b[sortCol];
    if (va === null || va === undefined) va = sortDir > 0 ? Infinity : -Infinity;
    if (vb === null || vb === undefined) vb = sortDir > 0 ? Infinity : -Infinity;
    if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sorted');
    const arrow = th.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = '↕';
  });
  const th = document.querySelector(`th[data-col="${col}"]`);
  if (th) {
    th.classList.add('sorted');
    th.querySelector('.sort-arrow').textContent = sortDir > 0 ? '↑' : '↓';
  }
  sortData();
  page = 0;
  renderPage();
}

function updateStats() {
  let tT = 0, tM = 0, tV = 0;
  filtered.forEach(d => { tT += d.stock_tarragona; tM += d.stock_murcia; tV += d.stock_valencia; });
  document.getElementById('stat-tarragona').textContent = tT.toLocaleString('es');
  document.getElementById('stat-murcia').textContent    = tM.toLocaleString('es');
  document.getElementById('stat-valencia').textContent  = tV.toLocaleString('es');
  document.getElementById('stat-total').textContent     = (tT + tM + tV).toLocaleString('es');
  document.getElementById('total-count').textContent    = filtered.length.toLocaleString('es');
}

function fmt(v) { return v !== null && v !== undefined ? v : '—'; }

function renderPage() {
  const tbody = document.getElementById('table-body');
  const start = page * PAGE_SIZE;
  const rows = filtered.slice(start, start + PAGE_SIZE);

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    document.getElementById('no-results').style.display = 'block';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  document.getElementById('no-results').style.display = 'none';

  tbody.innerHTML = rows.map(d => {
    const total = d.stock_tarragona + d.stock_murcia + d.stock_valencia;
    const dims = [d.ancho, d.alto, d.espesor].filter(v => v !== null && v !== undefined);
    return `
    <tr>
      <td class="td-ref">${d.ref}</td>
      <td class="td-desc">${d.desc}</td>
      <td><span class="td-tipo">${d.tipo}</span></td>
      <td class="td-dim">${fmt(d.ancho)}</td>
      <td class="td-dim">${fmt(d.alto)}</td>
      <td class="td-dim">${fmt(d.espesor)}</td>
      <td class="td-longitud">${d.longitud ? (d.longitud/1000).toFixed(2)+'m' : '—'}</td>
      <td><span class="td-acabado">${d.acabado}</span></td>
      <td class="td-peso">${d.peso_kg_m !== null ? d.peso_kg_m.toFixed(3) : '—'}</td>
      <td class="stock-cell ${d.stock_tarragona > 0 ? 'stock-tarragona' : 'zero'}">${d.stock_tarragona > 0 ? d.stock_tarragona : '—'}</td>
      <td class="stock-cell ${d.stock_murcia > 0 ? 'stock-murcia' : 'zero'}">${d.stock_murcia > 0 ? d.stock_murcia : '—'}</td>
      <td class="stock-cell ${d.stock_valencia > 0 ? 'stock-valencia' : 'zero'}">${d.stock_valencia > 0 ? d.stock_valencia : '—'}</td>
      <td class="stock-total ${total === 0 ? 'zero' : ''}">${total > 0 ? total : '0'}</td>
    </tr>`;
  }).join('');

  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${page-1})" ${page===0?'disabled':''}>← Ant</button>`;
  const start = Math.max(0, page - 2);
  const end = Math.min(total - 1, page + 2);
  if (start > 0) html += `<button class="page-btn" onclick="goPage(0)">1</button><span class="page-info">…</span>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i+1}</button>`;
  }
  if (end < total - 1) html += `<span class="page-info">…</span><button class="page-btn" onclick="goPage(${total-1})">${total}</button>`;
  html += `<button class="page-btn" onclick="goPage(${page+1})" ${page===total-1?'disabled':''}>Sig →</button>`;
  html += `<span class="page-info">${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE, filtered.length)} de ${filtered.length}</span>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) {
  page = p;
  renderPage();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function resetFilters() {
  document.getElementById('search-main').value = '';
  document.getElementById('filter-tipo').value = '';
  document.getElementById('filter-almacen').value = '';
  document.getElementById('filter-acabado').value = '';
  applyFilters();
}

// Live search
document.getElementById('search-main').addEventListener('input', applyFilters);
document.getElementById('filter-tipo').addEventListener('change', applyFilters);
document.getElementById('filter-almacen').addEventListener('change', applyFilters);
document.getElementById('filter-acabado').addEventListener('change', applyFilters);
</script>
</body>
</html>
