<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta Perfiles — Interno | Aluminios Franco</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#111827;color:#e5e7eb;min-height:100vh}
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#111827;z-index:9999;display:flex;align-items:center;justify-content:center}
.login-box{background:#1f2937;border-radius:16px;padding:40px;max-width:380px;width:90%;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.5)}
.login-box img{height:60px;margin-bottom:20px}
.login-box h2{color:#5A9A2E;margin-bottom:8px;font-size:1.3rem}
.login-box p{color:#9ca3af;font-size:.85rem;margin-bottom:20px}
.login-box input{width:100%;padding:12px 16px;border:2px solid #374151;border-radius:10px;background:#111827;color:#e5e7eb;font-size:1rem;font-family:'Outfit',sans-serif;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:#5A9A2E}
.login-box button{width:100%;padding:12px;border:none;border-radius:10px;background:#4A8C1C;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif}
.login-box button:hover{background:#5A9A2E}
.login-error{color:#f87171;font-size:.85rem;margin-top:8px;display:none}
header{background:linear-gradient(135deg,#1a3a0a 0%,#2d5a14 50%,#1a3a0a 100%);padding:20px 30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:50px}
header h1{color:#fff;font-size:1.4rem;font-weight:600}
header .badge{background:#4A8C1C;color:#fff;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:500}
.filters{background:#1f2937;padding:20px 30px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;border-bottom:1px solid #374151}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:.75rem;color:#9ca3af;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.filter-group input,.filter-group select{padding:8px 12px;border:1px solid #374151;border-radius:8px;background:#111827;color:#e5e7eb;font-size:.85rem;font-family:'Outfit',sans-serif;min-width:100px}
.filter-group input:focus,.filter-group select:focus{border-color:#5A9A2E;outline:none}
.precio-input{border-color:#fbbf24!important;color:#fbbf24!important;font-weight:600;max-width:80px;text-align:center}
.precio-label{color:#fbbf24!important}
.btn-copy-all{padding:8px 16px;border:none;border-radius:8px;background:#4A8C1C;color:#fff;font-size:.85rem;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:500;align-self:flex-end}
.btn-copy-all:hover{background:#5A9A2E}
.table-wrap{overflow-x:auto;padding:0 16px 16px}
table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:0}
thead th{background:#1f2937;color:#9ca3af;padding:10px 8px;text-align:left;position:sticky;top:0;cursor:pointer;font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:2px solid #374151;user-select:none}
thead th:hover{color:#5A9A2E}
thead th.sorted-asc::after{content:" ▲";color:#5A9A2E}
thead th.sorted-desc::after{content:" ▼";color:#5A9A2E}
tbody tr{border-bottom:1px solid #1f2937}
tbody tr:hover{background:#1f2937}
td{padding:8px;white-space:nowrap}
td.desc{white-space:normal;max-width:250px}
.stock-green{color:#34d399;font-weight:600}
.stock-orange{color:#fbbf24;font-weight:600}
.stock-gray{color:#6b7280}
.badge-stock{background:#d4edda;color:#155724;padding:2px 10px;border-radius:12px;font-size:.75rem;font-weight:500}
.badge-7dias{background:#fff3cd;color:#856404;padding:2px 10px;border-radius:12px;font-size:.75rem;font-weight:500}
.badge-sinstock{background:#f8d7da;color:#721c24;padding:2px 10px;border-radius:12px;font-size:.75rem;font-weight:500}
.btn-copy{background:none;border:none;cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:4px}
.btn-copy:hover{background:#374151}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px;flex-wrap:wrap}
.pagination button{padding:6px 14px;border:1px solid #374151;border-radius:8px;background:#1f2937;color:#e5e7eb;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.85rem}
.pagination button:hover{border-color:#5A9A2E}
.pagination button.active{background:#4A8C1C;border-color:#4A8C1C;color:#fff}
.pagination button:disabled{opacity:.4;cursor:default}
.page-info{color:#9ca3af;font-size:.85rem}
.euro-col{color:#fbbf24;font-weight:600}
@media(max-width:768px){
header{padding:16px}
header h1{font-size:1.1rem}
.filters{padding:12px;gap:8px}
.filter-group input,.filter-group select{min-width:80px;font-size:.8rem}
td{font-size:.7rem;padding:6px 4px}
}
</style>
</head>

BRUTO","tar":0,"mur":19,"val":0,"estado":"7/10 Días","precio_metro":1.54},{"ref":"NOR0032414","descripcion":"T - 30 X 30 X 1.5","tipo":"PERFIL T","alto":30.0,"ancho":30.0,"espesor":1.5,"longitud":6.4,"peso_kg_m":0.237,"acabado":"BRUTO","tar":0,"mur":185,"val":0,"estado":"7/10 Días","precio_metro":1.54}];
const PER_PAGE=40;
let filtered=DATA.slice();
let currentPage=1;
let sortCol=-1,sortAsc=true;

function init(){
if(sessionStorage.getItem('af_stock_auth')==='ok'){
document.getElementById('loginOverlay').style.display='none';
}
const sp=sessionStorage.getItem('af_precio_kg');
if(sp)document.getElementById('fPrecio').value=sp;
populateFilters();
applyFilters();
}

function doLogin(){
const p=document.getElementById('loginPwd').value;
if(p==='Murcia'){
sessionStorage.setItem('af_stock_auth','ok');
document.getElementById('loginOverlay').style.display='none';
}else{
document.getElementById('loginErr').style.display='block';
}
}

function populateFilters(){
const sets={tipo:new Set(),alto:new Set(),ancho:new Set(),espesor:new Set(),longitud:new Set()};
DATA.forEach(r=>{
if(r.tipo)sets.tipo.add(r.tipo);
if(r.alto!=null)sets.alto.add(r.alto);
if(r.ancho!=null)sets.ancho.add(r.ancho);
if(r.espesor!=null)sets.espesor.add(r.espesor);
if(r.longitud!=null)sets.longitud.add(r.longitud);
});
fillSelect('fTipo',[...sets.tipo].sort());
fillSelect('fAlto',[...sets.alto].sort((a,b)=>a-b));
fillSelect('fAncho',[...sets.ancho].sort((a,b)=>a-b));
fillSelect('fEspesor',[...sets.espesor].sort((a,b)=>a-b));
fillSelect('fLong',[...sets.longitud].sort((a,b)=>a-b));
}

function fillSelect(id,vals){
const sel=document.getElementById(id);
const first=sel.options[0].text;
sel.innerHTML='<option value="">'+first+'</option>';
vals.forEach(v=>{
const o=document.createElement('option');
o.value=v;o.textContent=v;
sel.appendChild(o);
});
}

function applyFilters(){
const s=document.getElementById('fSearch').value.toLowerCase();
const tipo=document.getElementById('fTipo').value;
const alto=document.getElementById('fAlto').value;
const ancho=document.getElementById('fAncho').value;
const esp=document.getElementById('fEspesor').value;
const lon=document.getElementById('fLong').value;
const precio=parseFloat(document.getElementById('fPrecio').value.replace(',','.'))||6.40;
sessionStorage.setItem('af_precio_kg',document.getElementById('fPrecio').value);

filtered=DATA.filter(r=>{
if(s&&!r.ref.toLowerCase().includes(s)&&!r.descripcion.toLowerCase().includes(s))return false;
if(tipo&&r.tipo!==tipo)return false;
if(alto&&r.alto!=parseFloat(alto))return false;
if(ancho&&r.ancho!=parseFloat(ancho))return false;
if(esp&&r.espesor!=parseFloat(esp))return false;
if(lon&&r.longitud!=parseFloat(lon))return false;
return true;
});

if(sortCol>=0)doSort();
currentPage=1;
render(precio);
}

function sortBy(col){
const ths=document.querySelectorAll('thead th');
ths.forEach(t=>{t.classList.remove('sorted-asc','sorted-desc')});
if(sortCol===col){sortAsc=!sortAsc}else{sortCol=col;sortAsc=true}
ths[col].classList.add(sortAsc?'sorted-asc':'sorted-desc');
doSort();
const precio=parseFloat(document.getElementById('fPrecio').value.replace(',','.'))||6.40;
render(precio);
}

function doSort(){
const keys=['ref','descripcion','tipo','alto','ancho','espesor','longitud','peso_kg_m','_euro','tar','mur','val','_total','estado'];
const k=keys[sortCol];
filtered.sort((a,b)=>{
let va,vb;
if(k==='_total'){va=(a.tar||0)+(a.mur||0)+(a.val||0);vb=(b.tar||0)+(b.mur||0)+(b.val||0)}
else if(k==='_euro'){va=a.peso_kg_m||0;vb=b.peso_kg_m||0}
else{va=a[k];vb=b[k]}
if(va==null)va='';if(vb==null)vb='';
if(typeof va==='string')return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
return sortAsc?va-vb:vb-va;
});
}

function render(precio){
const tbody=document.getElementById('tbody');
const start=(currentPage-1)*PER_PAGE;
const page=filtered.slice(start,start+PER_PAGE);
document.getElementById('countBadge').textContent=filtered.length+' referencias';

tbody.innerHTML=page.map((r,i)=>{
const euro=(r.peso_kg_m*precio).toFixed(2);
const total=(r.tar||0)+(r.mur||0)+(r.val||0);
const tc=v=>v>=10?'stock-green':v>0?'stock-orange':'stock-gray';
const badge=r.estado==='Stock'?'badge-stock':r.estado==='7/10 Días'?'badge-7dias':'badge-sinstock';
return '<tr>'+
'<td>'+r.ref+'</td>'+
'<td class="desc">'+r.descripcion+'</td>'+
'<td>'+r.tipo+'</td>'+
'<td>'+(r.alto!=null?r.alto:'')+'</td>'+
'<td>'+(r.ancho!=null?r.ancho:'')+'</td>'+
'<td>'+(r.espesor!=null?r.espesor:'')+'</td>'+
'<td>'+r.longitud+'</td>'+
'<td>'+(r.peso_kg_m||'')+'</td>'+
'<td class="euro-col">'+euro+'</td>'+
'<td class="'+tc(r.tar)+'">'+(r.tar||0)+'</td>'+
'<td class="'+tc(r.mur)+'">'+(r.mur||0)+'</td>'+
'<td class="'+tc(r.val)+'">'+(r.val||0)+'</td>'+
'<td class="'+tc(total)+'">'+total+'</td>'+
'<td><span class="'+badge+'">'+r.estado+'</span></td>'+
'<td><button class="btn-copy" onclick="copyRow('+i+')" title="Copiar">📋</button></td>'+
'</tr>';
}).join('');

renderPagination();
}

function renderPagination(){
const totalPages=Math.ceil(filtered.length/PER_PAGE);
const div=document.getElementById('pagination');
if(totalPages<=1){div.innerHTML='';return}
let h='<button onclick="goPage(1)" '+(currentPage===1?'disabled':'')+'>«</button>';
h+='<button onclick="goPage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>‹</button>';
const start=Math.max(1,currentPage-3),end=Math.min(totalPages,currentPage+3);
for(let p=start;p<=end;p++){
h+='<button onclick="goPage('+p+')" class="'+(p===currentPage?'active':'')+'">'+p+'</button>';
}
h+='<button onclick="goPage('+(currentPage+1)+')" '+(currentPage===totalPages?'disabled':'')+'>›</button>';
h+='<button onclick="goPage('+totalPages+')" '+(currentPage===totalPages?'disabled':'')+'>»</button>';
h+='<span class="page-info">'+filtered.length+' resultados · Pág '+currentPage+'/'+totalPages+'</span>';
div.innerHTML=h;
}

function goPage(p){
const totalPages=Math.ceil(filtered.length/PER_PAGE);
if(p<1||p>totalPages)return;
currentPage=p;
const precio=parseFloat(document.getElementById('fPrecio').value.replace(',','.'))||6.40;
render(precio);
window.scrollTo({top:0,behavior:'smooth'});
}

function copyRow(i){
const start=(currentPage-1)*PER_PAGE;
const r=filtered[start+i];
const precio=parseFloat(document.getElementById('fPrecio').value.replace(',','.'))||6.40;
const euro=(r.peso_kg_m*precio).toFixed(2);
const text=r.descripcion+' — '+r.longitud+' mm — '+euro+' €/m — '+r.estado;
navigator.clipboard.writeText(text).then(()=>{
const btn=document.querySelectorAll('.btn-copy')[i];
if(btn){btn.textContent='✓';setTimeout(()=>btn.textContent='📋',1500)}
});
}

function copyAll(){
const precio=parseFloat(document.getElementById('fPrecio').value.replace(',','.'))||6.40;
const lines=filtered.map(r=>{
const euro=(r.peso_kg_m*precio).toFixed(2);
return r.descripcion+' — '+r.longitud+' mm — '+euro+' €/m — '+r.estado;
});
navigator.clipboard.writeText(lines.join('\n')).then(()=>{
const btn=document.querySelector('.btn-copy-all');
btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent='📋 COPIAR RESULTADOS',2000);
});
}

init();

function borrarFiltros(){['fSearch','fTipo','fAlto','fAncho','fEspesor','fLong'].forEach(id=>{var el=document.getElementById(id);if(el)el.value='';});applyFilters();}

</script>
